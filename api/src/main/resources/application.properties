
spring.datasource.url=${DB_CONNECTION_STRING}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=app

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Tell Spring Boot to look into the classpath of the dependency module
spring.flyway.locations=classpath:sql/migration
spring.flyway.default_schema=app


logging.level.org.springframework.security=TRACE
# Enable logging for Spring Web MVC request handling
logging.level.org.springframework.web=DEBUG

# Enable logging for Jackson serialization/deserialization errors
logging.level.org.springframework.http.converter.json=DEBUG


app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=PT15M

lombok.fieldNameConstants.uppercase = true
